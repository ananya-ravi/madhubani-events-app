<!DOCTYPE html>

<html>

<head>
    <title>Create Event</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Create Event</h1>
    <p>Enter the details of your Madhubani art event.</p>

    <form class="event-form">
        <label for="event-name">Event Name</label>
        <input type="text" id="event-name" name="eventName">

        <label for="event-date">Event Date</label>
        <input type="date" id="event-date" name="eventDate">

        <label for="event-time">Event Time</label>
        <input type="time" id="event-time" name="eventTime">

        <label for="event-location">Location</label>
        <input type="text" id="event-location" name="eventLocation">

        <label for="event-type">Event Type</label>
        <select id="event-type" name="eventType">
            <option value="workshop">Workshop</option>
            <option value="exhibition">Exhibition</option>
            <option value="other">Other</option>
        </select>

        <label for="event-description">Description</label>
        <textarea id="event-description" name="eventDescription"></textarea>

        <button type="button">Create Event</button>
    </form>

    <p>
        <a class="back-link" href="index.html">← Back to Events</a>
    </p>
</body>

</html>
